# real_eagle v9_residual (2026-08-13) - THE FIRST CAMPAIGN THAT TRAINS THE POLICY AS A RESIDUAL
# ON THE NATIVE BT, and the first to train against a behaviour tree whose tactical layer actually
# executes.
#
# ==========================================================================================
# WHAT IS DIFFERENT FROM v8 -- read this before comparing v9 against any earlier campaign.
# ==========================================================================================
#
#  A. RESIDUAL TRAINING (env.residual_training below, 4.1 F26/D3-REBASED). v1-v8 all trained
#     STANDALONE policies -- the network had to learn flight, survival AND tactics from a blank
#     init. "Hybrid" was only ever assembled at INFERENCE by StudentHybridProvider
#     (final = BT + 0.35*policy), so every bundle was optimised for a job it was never given.
#     That is a plausible part of why D3-REBASED measured every hybrid config as <= vptrack alone.
#     v9 composes the SAME arithmetic during training, so the policy learns the correction it will
#     actually be asked to make. Verified algebraically identical to the inference composition by
#     scripts/verify_residual_wrapper.py -- which caught a real throttle-halving bug in the first
#     draft. Re-run it after touching either side.
#
#  B. THE OPPONENT IS A DIFFERENT, MUCH STRONGER AIRCRAFT (4.1 F25/F26). v1-v8 trained against a
#     tree that ran exactly TWO leaf nodes: a `name=` attribute made BehaviorTree.CPP build all 17
#     named composites with ZERO children, so the whole tactical layer was dead code. Fixed
#     2026-08-13. The BT opponent now runs 17 nodes across all five gate blocks, went from 0 to 2
#     kills in BT-vs-BT and from 8 to 967 WEZ-contact steps. **v9's difficulty curve is therefore
#     NOT comparable to v1-v8's** -- a worse-looking v9 stage result may mean a harder opponent,
#     not a worse policy. Do not read v8 numbers as a baseline.
#
#  C. Everything else is deliberately unchanged from v8: same 16-stage curriculum, same gates,
#     same hyperparameters, same sampling. Comparability is broken by A and B alone, which is the
#     point -- one campaign, two intended changes, nothing incidental.
#
# The v8 mechanics below (gates that measure what they name, the match_base ladder, telemetry,
# G limiter, stage budgets) all still apply and are carried forward verbatim.
#
# v7 was stopped after 313 iterations because its stage advances were invalid. Do NOT resume v7,
# and do not compare against its stage results -- they are void. Full detail in
# References and Manuals/COMPETITION_PLAN.md 4.1 F6.
#
# WHAT IS DIFFERENT FROM v7. Again none of it is a hyperparameter.
#
#  1. THE ADVANCEMENT GATE NOW MEASURES WHAT IT NAMES (4.1 F6). Two defects, both from E2's
#     carry-forward:
#       * the carried metrics were module-level globals never cleared between stages, so a new
#         stage inherited the previous stage's last episode. v7's stage 1 advanced after 10
#         iterations having closed ZERO episodes of its own.
#       * the gate averaged over ROWS, not episodes. carry-forward repeats the last measured
#         episode on every iteration that closes none (~26 of 27), so v7's stage 0 final window
#         was 8 copies of its single non-crashing episode plus 2 of a crashing one. It read
#         crash_rate=0.2000, passed a crash_rate_max=0.30 gate, and advanced -- while the TRUE
#         rate over that stage's 7 episodes was 0.8571.
#     Now: carry is reset at each stage boundary, and the gate consumes one row per closed
#     episode, so advance_window=10 means an average over 10 real measurements.
#
#  2. THE CURRICULUM TRAINS THE OFFICIAL BEAM MERGE (4.1 F8, F8-STAGES). v7's own header called
#     this "the single highest-value change available to this campaign" and then did not do it.
#     Done now: match_base_wide (914.4 m) -> match_base_close (609.6 m) -> match_base
#     (609.6-914.4 m sampled, the competition preset), all at 4572 m / 200 m/s / LOS 90 deg,
#     replacing two-circle alphas 45/90/135/180 (which spawned at ~3500-5486 m, a geometry no
#     round presents). Alphas 0/3/5/8/12 are KEPT -- their 152 m lateral-spacing analysis is real
#     BFM at ranges the match does produce. 17 -> 16 stages.
#     MatchScenarioWrapper is now wired into train_curriculum.env_creator(); before 2026-08-11 it
#     was in the eval scripts only, so a match_base stage would have silently trained the DEFAULT
#     spawn while its name and logs claimed otherwise.
#
#  3. TELEMETRY GAPS CLOSED. reward_mean/ep_len_mean were read straight off env_runners and were
#     `nan` on 163 of v7's 194 rows; they are now carried with the custom metrics under one shared
#     metrics_age_iters. And every stage advancement was silently failing to write its
#     training_record (KeyError 'iteration', swallowed into a one-line warning) -- fixed, and the
#     handler now prints the traceback.
#
#  4. G LIMITER carried from v7, and now measured FREE: 80 self-play/peer episodes at N=30 each
#     reproduce the pre-limiter win rates within sampling error (4.1 F11). In-match G is ~1.5
#     against a 10 G cap, so it costs nothing and removes a train/deploy divergence.
#
# WHAT TO CHECK EARLY -- this replaces v7's telemetry check, which now passes trivially:
#     * rows with metrics_age_iters == 0 should appear roughly every 27 iterations. Those are the
#       only rows the gate counts and the only ones worth averaging by hand.
#     * NO stage should advance before ten such rows exist within it. If one does, F6 has
#       regressed -- stop and read train_curriculum._run_stage's episode_window.
#     * a stage's first rows should read "n/a", NOT the previous stage's numbers.
#
# WHAT THIS DOES NOT FIX, stated so the run is not misread as a fresh start:
#     * v7's stage 0 crashed on 8 of its first 9 closed episodes, with ep_altitude_penalty_steps
#       firing on exactly those 8 and zero on the survivor. NOTHING here addresses that. v8 will
#       report it honestly instead of advancing past it -- which means stage 0 may now sit at
#       max_iterations rather than falsely advancing. That is the fix working, not a new failure.
#     * the ~1.2 G ceiling (4.1 F12) is DOWNSTREAM of the action: both controllers already command
#       full aft stick most of the time and still get ~1.2 G, and G is *higher* at low pitch
#       command than at full. It will bound this policy exactly as it bounds the BT. No reward or
#       hyperparameter change reaches it.
#
#  5. STAGE BUDGETS RAISED SO THE GATES CAN ACTUALLY FIRE (4.1 F6-COST). Making advance_window
#     mean ten EPISODES has a budget consequence: a stage must run long enough to close ten, or
#     its gate is never evaluated and it exits on max_iterations with the condition untested --
#     silently, and indistinguishably from v5/v6's behaviour. At ~27 iterations/episode that is
#     ~270 iterations, and TEN of the fifteen gated stages were still budgeted at 200 (~7.4
#     episodes), including all three match_base stages. Those ten are now 400 (~14.8 episodes).
#     scripts/verify_report_fixes.py asserts the reachability property so it cannot regress.
#
# COST, measured from v7 rather than assumed (4.1 F6-COST): 101.8 env steps/iteration at
# ~10.9 s/iter against 2,734-step episodes = ~27 iterations per episode, so an honest 10-episode
# gate is ~270 iterations ~= 49 min per stage. With the budgets above that is 7,300 iterations
# total, ~22 h -- up from the 16 h the un-gateable 200-iteration version would have taken, and the
# extra 6 h is what buys gates that mean something. Sampling was deliberately NOT changed to speed
# this up: raising steps/iteration does not reduce the ~27k env steps a 10-episode gate needs and
# would alter SAC's update-to-data ratio, and shortening episodes would change what
# flight_survival means. Hyperparameters stay identical to v6/v7 so v8 remains comparable.
#
# run:
#   python scripts\run_experiment.py experiments\real_eagle_v9_residual.yaml
# dry-run (validate wiring, no training):
#   python scripts\run_experiment.py experiments\real_eagle_v9_residual.yaml --dry-run
#
# CONFIRM RESIDUAL TRAINING IS ACTUALLY ON before letting it run 22 h. env_creator prints
#   [env_creator] ResidualBTWrapper ACTIVE -- policy trains as a residual on AIP_BASE.dll at scale 0.35
# once per env build. If that line is absent the wrapper is OFF and this is just another
# standalone campaign wearing a v9 label -- kill it and check env.residual_training.enabled.
# ("It is in the tree" is not "it is wired in": five features have shipped inert in this project.)

name: real_eagle_v9_residual
script: train_curriculum

output:
  name: real_eagle
  tag: v9_residual

env:
  observation_mode: custom
  reward_module: student.my_reward
  target_behavior_dll: AIP_BASE_target.dll
  observation_module: student.my_observation_v2

  # RESIDUAL TRAINING (2026-08-13) -- the point of this campaign.
  # v1-v8 all trained STANDALONE policies; "hybrid" was only ever assembled at inference by
  # StudentHybridProvider, so no bundle was ever optimised for the composition it was deployed
  # into. This trains the policy as a CORRECTION on the native BT instead:
  #     final_action = BT_action + residual_scale * policy_action
  # student/residual_training_wrapper.py, verified algebraically identical to the inference
  # composition by scripts/verify_residual_wrapper.py (run it after touching either side).
  #
  # bt_dll is the OWNSHIP-side name, deliberately NOT target_behavior_dll: Windows loads a DLL
  # once per resolved path, so sharing one file with the opponent would share its static
  # blackboard state too -- the same reason AIP_BASE.dll and AIP_BASE_target.dll are two files.
  #
  # residual_scale 0.35 matches the shipping default in my_submission.py. The measured inference
  # cliff (4.1 D3-REBASED: 0.02 -> 12/30, 0.10 -> 13/30, 0.35 -> 0/30) was produced by the v6
  # policy, which was NOT trained as a residual -- a trained residual should tolerate this
  # authority, but that is a hypothesis. Deploy at the scale it was TRAINED at, and re-sweep
  # rather than trusting either number.
  residual_training:
    enabled: true
    bt_dll: AIP_BASE.dll
    residual_scale: 0.35

curriculum:
  stages_module: student.my_curriculum

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.997
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 300000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  # Kept from v5/v6/v7: remote workers hit msgpack-OOM / concat_episode races on this box.
  # Measured cost, and why it is accepted rather than tuned: 101.8 env steps per iteration at
  # ~10.9 s/iter, so a 10-episode advance gate is ~268 iterations (~49 min) per stage. See the
  # COST note in this file's header -- raising this does not reduce the env steps a gate needs,
  # it only relabels them across fewer, longer iterations, while changing the update-to-data
  # ratio and breaking comparability with v6/v7.
  num_env_runners: 0
  # Safe: this resumes v8's OWN state file if v8 is interrupted and relaunched. It can never pick
  # up v7 -- that is keyed by tag. Do NOT point a v7 tag at this file: the match_base ladder
  # changed the MEANING of every stage index after the first two-circle stage, and
  # _init_or_load_state() cannot repair an index whose meaning changed under a completed stage.
  resume: true

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 100
  steps: 400
  episodes: 1
  print: true

notes: >
  real_eagle v9_residual (2026-08-13). FIRST campaign to train the policy as a RESIDUAL on the
  native BT (final = BT + 0.35*policy) instead of as a standalone controller -- v1-v8 all trained
  standalone and "hybrid" was only ever assembled at inference, so no bundle was ever optimised
  for the composition it was deployed into. Composition verified algebraically identical to
  StudentHybridProvider's by scripts/verify_residual_wrapper.py. ALSO the first campaign trained
  against a behaviour tree whose tactical layer actually executes: until the F25 fix on
  2026-08-13 the opponent ran exactly two leaf nodes (17 named composites built with zero
  children), and it now runs 17 nodes across all five gate blocks. THE OPPONENT IS THEREFORE
  MUCH STRONGER THAN IN v1-v8 AND THESE STAGE RESULTS ARE NOT COMPARABLE TO THOSE CAMPAIGNS --
  a worse-looking stage may mean a harder opponent, not a worse policy. Curriculum, gates,
  sampling and all hyperparameters are unchanged from v8 so those two changes are the only
  intended differences. Expect ~49 min per stage (~22 h total). v7/v8's stage-0 self-crash is
  NOT addressed here; it will be reported honestly rather than advanced past.
