# real_eagle v4 - the post-audit corrected run (2026-07-12).
#
# v3's setup with the four root-cause fixes from the full-codebase audit that
# found v1+v3's two-circle stages 93-100% degenerate (guard-fail losses, zero
# wins, zero WEZ time in 7400+ total iterations):
#   1. Crash terminal reward: ground impact now pays crash_penalty (-100 via
#      loss_reward fallback), not draw_reward -- v3's defensive stage paid +20
#      per suicide and learned a 100% crash rate (student/my_reward.py).
#   2. Geometry guard: range-based disengagement guard (leave the fight beyond
#      8 km = loss) replaces the physically-unpassable ATA-limit guard that
#      trained merge AVOIDANCE (src/dogfight/envs/termination.py).
#   3. Curriculum: student/my_curriculum.py rebuilt -- 5-alpha two-circle
#      ladder (0/45/90/135/180) with pursuit_range 8 km + advantage term 0.1
#      so spawns are inside the shaping gradient; full_dogfight extended to
#      1500 iterations with the freed budget. OBFM stages kept.
#   4. Observation: student.my_observation_v2 (15 features) adds target speed
#      (live-parity safe); separate module so v3 could keep running.
# Plus observability: SAC learner metrics extraction fixed (was all-n/a),
# all reward components in the CSV, and engagement replays enabled below.
#
# This is a SEPARATE run from v3 (different curriculum + obs size = fresh tag).
# Do NOT launch while v3 is still training (CPU contention) -- stop v3 first
# or use scripts/launch_v4_when_free.ps1.
#
# NOTE: keep this file pure ASCII (run_experiment.py prints notes to a cp949
# console, which crashes on non-ASCII).
#
# run:
#   python scripts\run_experiment.py experiments\real_eagle_v4.yaml
# dry-run:
#   python scripts\run_experiment.py experiments\real_eagle_v4.yaml --dry-run

name: real_eagle_v4
script: train_curriculum

output:
  name: real_eagle
  tag: v4

env:
  observation_mode: custom
  reward_module: student.my_reward
  target_behavior_dll: AIP_BASE_target.dll
  observation_module: student.my_observation_v2

curriculum:
  stages_module: student.my_curriculum

algo:
  name: sac
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 256
  minibatch_size: 256
  tau: 0.005
  target_entropy: auto
  replay_buffer_capacity: 100000
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu

runtime:
  # REVERTED to 0 (2026-07-13, after a live recurrence). ner=2's justifying
  # measurement ("0 iterations in 180 s" for ner=0) was itself later found to
  # be a stdout-buffering artifact, not real throughput -- PowerShell's `*>`
  # redirect block-buffers Python's per-iteration prints, so the console log
  # lags actual progress badly; curriculum_state.json/training_log.csv (which
  # flush every iter) are the only reliable progress source, and by THAT
  # measure ner=0 was fine all along. ner=2 then ran clean for a while (3.95
  # iters/min, 1.1-1.3 GB free oscillating) which is why it stuck as the
  # setting -- but tonight (2026-07-13 ~00:21) the exact OOM/msgpack failure
  # class this whole comment block was written to explain (`MemoryError:
  # Unable to allocate internal buffer` in Ray's msgpack deserialization on a
  # SingleAgentEnvRunner worker) recurred under this same ner=2 config despite
  # the object-store cap below, and hung the driver (near-zero CPU for 7+ min,
  # no crash the supervisor could detect). ner=0 removes the entire remote-
  # worker code path where both documented failure modes live (msgpack
  # episode-transfer OOM and the concat_episode restart race) regardless of
  # how tight system memory gets -- reliability over throughput, especially
  # for an unattended run. Revisit ner=2 only with real headroom confirmed
  # (check free RAM right before launch, not from an old measurement).
  num_env_runners: 0
  resume: true                      # resume the crashed run if v4 state exists; fresh start otherwise

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

# Periodic greedy-policy replay episodes saved as Tacview CSVs -- the
# trajectory-level view whose absence made v3's crash-suicide behavior
# invisible until the stage aggregates were audited. Each trigger builds and
# tears down a fresh JSBSim+BT env in the driver, so on this memory-tight box
# the interval is 100 (not 50) and episodes are capped at 400 steps to keep
# the transient spike small and infrequent; there is ample headroom now that
# num_env_runners=0 and the object store is capped.
engagement_log:
  enabled: true
  interval: 100
  steps: 400
  episodes: 1
  print: true

notes: >
  real_eagle v4 (2026-07-12). Supersedes v3 (audited at stage 13/17: the
  two-circle ATA guard was unpassable - 100pct guard-fail losses across
  v1+v3 - and crashes paid draw_reward, +20 in obfm_defensive, which learned
  a 100pct suicide rate). Fixes: crash_penalty routing, range-based
  disengagement guard, 5-alpha two-circle ladder with 8km shaping reach +
  advantage term, full_dogfight 1500 iters, obs v2 (+target speed), SAC
  metrics extraction, engagement replays.
