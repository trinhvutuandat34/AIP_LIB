# yaml-language-server: $schema=agent.schema.json
#
# 진단용 최소 트리 — MATCH_LOG.md 발견 4(및 라운드 2 재확인) 검증 전용.
# 제출용 파일이 아니다 (agents/agent.yaml 이 제출본).
#
# 목적: below_fighting_speed(kcas) 조건이 실제로 ACMI 의 CAS 필드와 같은 값을
# 비교하는지 확정한다. 라운드 2(40경기 재분석)에서 below_fighting_speed(kcas:220)
# 이 참이어야 할 tick 의 93%(6,055개 중 5,659개 — merged(9000ft) 게이트도 같이
# 참, 즉 critical_energy_recover(agent.yaml §3)의 두 조건이 ACMI 로그 기준으로는
# 다 만족됨)에서 실제로는 그 분기가 tick 을 못 가져갔다(전 경기 300s 배터리에서
# critical_energy_recover 점유가 상위 10개 노드에 든 적이 한 번도 없음 — 즉 거의
# 0s). 이 미스매치가 진짜라면 below_fighting_speed 가 ACMI CAS 가 아닌 다른 값
# (TAS 등)을 보고 있다는 뜻이고, 그렇다면 agent.yaml 의 §2(wounded_disengage)
# ·§3(critical_energy_recover)·§13(energy_recover) 셋 다 사실상 죽은 분기라는
# 뜻이 된다 — 40경기 내내 아무 매치의 상위-10 점유 목록에도 안 나온 것과 정합적.
#
# 실행 (Windows, SDK 루트에서, my_agents/ 에 복사 후):
#   copy 이 파일 my_agents\diag_kcas.yaml
#   python scripts\run_match.py --scenario neutral --seed 3 ^
#     --blue my_agents\diag_kcas.yaml --red examples\energy_fighter.yaml --analyze
#
# 판정: 리플레이의 ACMI 를 tools/analyze_acmi.py 로 열어 L1.node 를 보면 끝난다.
#   - CAS 가 220kt 밑으로 떨어지는 구간에서 활성 노드가 "kcas_below_220_TRUE" 로
#     바뀌면: kcas 는 CAS 를 정확히 읽는다 — 그러면 agent.yaml §2/§3/§13 이 실전에서
#     거의 안 잡히는 건 다른 원인(예: 상위 우선순위 분기가 그 tick 을 매번 먼저
#     가로챔 — 이것도 있을 법함, 위 조건 만족 tick 의 상당수가 §0/1/1b/2 가 아니라
#     §4 이후 저순위 분기였다는 라운드 2 관찰과 대조해볼 것)를 찾아야 한다.
#   - CAS 가 220kt 아래인데도 활성 노드가 계속 "kcas_below_220_FALSE" 라면:
#     kcas 파라미터가 CAS 가 아닌 다른 값(TAS 등)을 비교하고 있다는 확정 증거 —
#     below_fighting_speed 사용처 3곳의 kcas 문턱을 그 실제 값 기준으로 재보정
#     해야 한다(예: TAS 는 고도에 따라 CAS 보다 커지므로, 현재 220/325 문턱이
#     의도한 것보다 훨씬 약하게 걸릴 것이다).

agent_name: DiagKcas
selector:
  - sequence:
      - condition: {name: below_fighting_speed, kcas: 220}
      - action: {pursuit: pure, name: kcas_below_220_TRUE}
  - action: {pursuit: pure, name: kcas_below_220_FALSE}
